name: sig

on:
  push:
    branches:
    - master
  pull_request:
    types:
    - opened
    - synchronize
    - reopened

jobs:
  sig:
    runs-on: "ubuntu-latest"
    env:
      BUNDLE_WITH: sig
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          bundler-cache: true
          ruby-version: ruby
      - name: Run RBS test
        run: bundle exec rake rbs:test
