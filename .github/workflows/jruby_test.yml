name: JRuby-test

on:
  push:
    branches:
    - master
  pull_request:
    types:
    - opened
    - synchronize
    - reopened

jobs:
  host:
    name: ${{ matrix.ruby }}
    runs-on: ubuntu-latest

    env:
      BUNDLE_WITHOUT: sig

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - jruby
          - jruby-head

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: ${{ matrix.ruby }}

      - run: bundle install

      - run: rake compile

      - run: rake test TEST=test/bigdecimal/test_jruby.rb

      - run: rake build

      - run: gem install pkg/*.gem
